[package]
name = "proxypilot-app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# Имя двоичного файла — то, что человек увидит в диспетчере задач и в
# автозапуске, поэтому без суффикса крейта.
[[bin]]
name = "proxypilot"
path = "src/main.rs"

[dependencies]
proxypilot-core = { path = "../core" }
proxypilot-bridge = { path = "../bridge" }
proxypilot-winnet = { path = "../winnet" }
proxypilot-icon = { path = "../icon" }
# Только `install`/`uninstall` (регистрация в SCM) — команды
# `install-service`/`uninstall-service` ниже в `main.rs`. Единственный
# запрос UAC во всём продукте, вызывается не этой сессией.
proxypilot-netsvc = { path = "../netsvc" }
tokio = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }
tray-icon = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    # Системный ГСЧ (`BCryptGenRandom`) для токена страницы настроек.
    "Win32_Security_Cryptography",
    # Проверка подписи Authenticode скачанного обновления (`update::verify`,
    # `WinVerifyTrust`) — системный API, есть на любой Windows, в отличие от
    # `signtool.exe` (инструмент Windows SDK, которого на машине получателя
    # нет).
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    # `ShellExecuteW` — открыть страницу настроек в браузере пользователя.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Скачивание релиза с GitHub (`update::source`) через системный
    # HTTPS-клиент Windows: TLS достаётся бесплатно от системы, а не от
    # нового звена в дереве зависимостей, которое придётся подписывать.
    "Win32_Networking_WinHttp",
] }

# Только для теста WinAutostart в main.rs, который трогает реальный Run:
# нужна пара raw_value_for_tests/restore_raw_value_for_tests, скрытая под
# фичей `test-registry` (не для продакшна — restore пишет в реестр
# произвольную строку без проверок, которых требует enable/disable).
# resolver = "2" в win/Cargo.toml не унифицирует dev-фичи в сборку
# продакшн-бинарника, поэтому в нём этих функций не будет вовсе.
[dev-dependencies]
proxypilot-winnet = { path = "../winnet", features = ["test-registry"] }
# Только для tests/version_resource.rs: GetFileVersionInfoW/VerQueryValueW,
# которыми тест читает VS_FIXEDFILEINFO уже собранного exe. Отдельно от
# фич windows выше — в продакшн-бинарник (только [dependencies]) это не
# попадает.
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

# build.rs генерирует .ico из того же кода, что рисует иконки трея
# (`proxypilot-icon`), и вшивает его вместе с версией/метаданными в exe.
[build-dependencies]
proxypilot-icon = { path = "../icon" }
winres = "0.1"
ico = "0.5"
