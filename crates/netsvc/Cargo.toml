[package]
name = "proxypilot-netsvc"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# Библиотека несёт всё проверяемое (разбор profile.toml, формирование
# команд netsh, страховка отката, установка/удаление службы) — двоичный
# файл только связывает это со входом SCM (`service.rs`), который
# автотестами не достижим никак: он либо запущен диспетчером служб
# Windows, либо не запускается вовсе (см. `CLAUDE.md`, «Живые проверки,
# которые не делает агент» — установка службы туда входит явно).
[lib]
name = "proxypilot_netsvc"
path = "src/lib.rs"

[[bin]]
name = "proxypilot-netsvc"
path = "src/main.rs"

[dependencies]
proxypilot-core = { path = "../core" }
# COM-апартамент (`ComGuard`) и `format_guid` — та же обвязка NLM, что и в
# приложении и в `winnet::networks::list_connected`; не дублируется здесь.
proxypilot-winnet = { path = "../winnet" }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
directories = { workspace = true }
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    # Опознание адаптера офисной сети через NLM (докблок `adapter.rs`).
    "Win32_Networking_NetworkListManager",
    # `GetAdaptersAddresses` — дружественное имя адаптера по его GUID,
    # то самое, что ожидает `netsh ... name=`.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # Служба: StartServiceCtrlDispatcherW, RegisterServiceCtrlHandlerExW,
    # SetServiceStatus, CreateServiceW/DeleteServiceW (install.rs, service.rs).
    "Win32_System_Services",
    "Win32_System_SystemServices",
] }
